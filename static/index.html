<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>OIDC Login</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f7f9;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            width: 350px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #msg {
            color: #d9534f;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>SSO 登录</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="用户名" required>
            <input type="password" id="password" placeholder="密码" required>
            <button type="submit">登录</button>
        </form>
        <div id="msg"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.innerText = "正在加密并登录...";

            try {
                // 1. 从 URL 获取 OIDC 上下文参数
                const urlParams = new URLSearchParams(window.location.search);
                const clientId = urlParams.get('client_id'); // 新增：从 URL 获取 client_id
                const redirectUri = urlParams.get('redirect_uri');
                const state = urlParams.get('state');

                // 基础校验
                if (!clientId || !redirectUri) {
                    throw new Error("缺少 OIDC 参数 (client_id 或 redirect_uri)");
                }

                // 2. 获取服务器公钥
                const keyRes = await fetch('/auth/provider-key');
                if (!keyRes.ok) throw new Error("无法获取服务器密钥");
                const { pub_key } = await keyRes.json();

                // 3. 加密凭据
                const encryptor = new JSEncrypt();
                encryptor.setPublicKey(pub_key);

                const encUser = encryptor.encrypt(document.getElementById('username').value);
                const encPass = encryptor.encrypt(document.getElementById('password').value);

                // 4. 提交登录请求
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: encUser,
                        password: encPass,
                        client_id: clientId,      // 必须包含此字段以匹配 Rust 的 LoginRequest
                        redirect_uri: redirectUri,
                        state: state
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    // 5. 构建安全的回调 URL
                    const target = new URL(data.redirect_uri);
                    target.searchParams.set('code', data.code);
                    if (data.state) {
                        target.searchParams.set('state', data.state);
                    }
                    // 跳转回 AList
                    window.location.href = target.toString();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    msg.innerText = "登录失败: " + (errData.message || res.statusText);
                }
            } catch (err) {
                console.error("Detailed Error:", err);
                msg.innerText = "错误: " + err.message;
            }
        };
    </script>
</body>

</html>
