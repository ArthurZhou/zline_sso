<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>继续登录</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --secondary-color: #e9ecef;
            --secondary-text: #495057;
            --secondary-hover: #dee2e6;
            --accent-bg: #f8f9fa;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-main: #e0e0e0;
                --text-sub: #b0b0b0;
                --primary-color: #375a7f;
                --primary-hover: #4b7eb0;
                --secondary-color: #2d2d2d;
                --secondary-text: #e0e0e0;
                --secondary-hover: #3d3d3d;
                --accent-bg: #2d2d2d;
                --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            }
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            transition: background-color 0.3s ease;
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 600;
        }

        .user-info {
            background-color: var(--accent-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .user-label {
            font-size: 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .username {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }

        p {
            margin: 0 0 32px 0;
            color: var(--text-sub);
            font-size: 15px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            outline: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: var(--secondary-text);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
                margin: 20px;
                box-shadow: none;
                background: transparent;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>欢迎回来</h2>
        <div class="user-info">
            <span class="user-label">当前登录账号</span>
            <span class="username">{{username}}</span>
        </div>
        <p>是否直接进入系统？</p>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="handleContinue()">使用当前账号继续</button>
            <button class="btn btn-secondary" onclick="handleLogout()">切换账号</button>
        </div>
    </div>

    <script>
        const queryParams = window.location.search;

        async function handleContinue() {
            try {
                const resp = await fetch(`/auth/continue${queryParams}`);
                if (resp.ok) {
                    const data = await resp.json();
                    let target = `${data.redirect_uri}?code=${data.code}`;
                    if (data.state) target += `&state=${encodeURIComponent(data.state)}`;
                    window.location.href = target;
                } else {
                    const errorText = await resp.text();
                    alert("登录失败: " + errorText);
                }
            } catch (e) {
                alert("网络请求失败，请检查网络连接");
            }
        }

        function handleLogout() {
            window.location.href = `/auth/logout${queryParams}`;
        }
    </script>
</body>
</html>
