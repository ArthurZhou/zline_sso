# zline SSO 配置文件 (TOML)
# 服务监听地址与端口
host = "127.0.0.1"
port = 8097

# 发行方标识，用于 JWT `iss` 与发现文档
issuer = "http://127.0.0.1:8097"

# 业务路由前缀（登录页、各 OIDC 端点均挂载在该前缀下）
auth_path_prefix = "/sso"

# GeoIP MMDB 文件路径（缺失时仅日志告警，地理位置信息不可用）
geoip_mmdb_path = "GeoLite2-City.mmdb"

# 个人中心展示最近登录/尝试记录的时间窗口（天）
login_record_window = 5

# 允许跨域访问的来源（用于 CORS 响应头，形如 "http://host:port"）
cors_allowed_origins = [
    "http://127.0.0.1:8080",
]

# 会话 Cookie 是否带 Secure 标志（部署在 HTTPS 反代后时必须设为 true；
# 纯 HTTP 内网部署保持 false，否则 Cookie 不会发送）
cookie_secure = false

# 前端登录负载 AES-256-GCM 共享密钥及允许的时钟偏差
[frontend_crypto]
shared_key = "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
max_clock_skew_secs = 300

# 速率限制（burst 大小）
[rate_limit]
per_second = 20

# 登录失败锁定策略
[account_lockout]
failed_attempts_threshold = 5
lockout_duration_minutes = 30

# 管理员账户（仅允许用户中心登录，不允许 OAuth 授权）
# password_hash 为管理员密码的 SHA-256 十六进制摘要，生成方式：
#   echo -n "你的密码" | sha256sum
# 或 Python: python -c "import hashlib; print(hashlib.sha256(b'你的密码').hexdigest())"
[admin]
username = "320241141"
# 随机生成的强密码（每次部署请重新生成），生成方式同下方注释
password_hash = "4d65b64e324d3c0b7619410326fdf548b98a41100f1cab6a967b2016b2a8aa1b"

# 已注册 OIDC 客户端
# redirect_uris 支持两种写法：
#   1. 纯字面量：进行精确字符串匹配（如 "http://127.0.0.1:8080/callback"）
#   2. 正则表达式：包含 * + ? ( ) [ ] { } ^ $ | \ 等元字符时按正则匹配
#      （如 "^http://localhost:\\d+/callback$"）
[[clients]]
client_id = "test_client"
client_secret = "test_client_secret"
redirect_uris = [
    "http://127.0.0.1:8080/callback",
    "^http://localhost:\\d+/callback$",
]
return_extra_userinfo = [
    "external_uid",
    "full_name",
    "student_id",
    "gender",
    "role",
]

# oneshare 客户端（OIDC 对接）
# oneshare 侧 [oidc] 配置：
#   issuer_url = "http://127.0.0.1:8097"          （与上方 issuer 一致）
#   client_id = "oneshare"
#   client_secret = "gSumRHZDEcuImSBI9Ps0KKdEVVDT7KFZ"
#   redirect_uri = "http://127.0.0.1:3456/auth/callback"
# 端点可全部走 discovery（/.well-known/openid-configuration），无需显式配置
[[clients]]
client_id = "oneshare"
client_secret = "gSumRHZDEcuImSBI9Ps0KKdEVVDT7KFZ"
redirect_uris = [
    "http://127.0.0.1:3456/auth/callback",
]
# role 必须返回：oneshare 用 userinfo 的 role claim 自动加入对应分组
return_extra_userinfo = [
    "external_uid",
    "full_name",
    "student_id",
    "gender",
    "role",
]
