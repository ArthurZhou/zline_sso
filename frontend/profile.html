<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>个人中心 - 校园工作台 SSO</title>
    <style>
        @font-face {
            font-family: sarasa;
            src: url('/font.woff');
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --border: #1a1a1a;
            --input-bg: #f2f2f2;
            --accent: #000000;
            --accent-text: #ffffff;
            --error: #e63946;
            --success: #06d6a0;
            --warn: #f4a261;
            --muted: #666666;
            --card-bg: #f9f9f9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text: #eeeeee;
                --border: #444444;
                --input-bg: #1e1e1e;
                --accent: #eeeeee;
                --accent-text: #121212;
                --muted: #888888;
                --card-bg: #1e1e1e;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: ui-monospace, sarasa, monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            border-bottom: 4px solid var(--border);
            margin-bottom: 30px;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-logout {
            background: var(--error);
            color: var(--accent-text);
        }

        .btn-action {
            background: var(--accent);
            color: var(--accent-text);
            margin-top: 10px;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: none;
            border: none;
            padding: 0;
        }

        .card h2 {
            margin: 0 0 15px 0;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .sync-section {
            margin-top: 20px;
        }

        .sync-note {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.4;
        }

        .info-label {
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
        }

        .info-value {
            color: var(--text);
            word-break: break-all;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            margin-right: 5px;
            background: var(--success);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.locked {
            background: var(--error);
            color: white;
        }

        .status-badge.warn {
            background: var(--warn);
            color: black;
        }

        .hidden {
            display: none;
        }

        .loading,
        .error-container {
            text-align: center;
            padding: 40px;
        }

        .error-message {
            color: var(--error);
            font-weight: 700;
            padding: 15px;
            background: var(--input-bg);
            text-align: left;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: var(--muted);
            line-height: 1.6;
            text-align: center;
        }

        .footer a {
            color: var(--text);
            text-decoration: underline;
        }

        /* 标签管理 */
        .tag-subtitle {
            margin: 14px 0 10px 0;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--muted);
        }

        .tag-subtitle:first-of-type {
            margin-top: 0;
        }

        .tag-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tag-input {
            flex: 1;
            min-width: 200px;
            padding: 8px;
            background: var(--input-bg);
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .tag-input:focus {
            border-bottom-color: var(--text);
        }

        .btn-tag {
            background: var(--accent);
            color: var(--accent-text);
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text);
        }

        .tag-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .tag-table th,
        .tag-table td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--input-bg);
            vertical-align: middle;
        }

        .tag-table th {
            text-transform: uppercase;
            font-size: 11px;
            white-space: nowrap;
        }

        .tag-badge {
            display: inline-block;
            padding: 2px 7px;
            margin: 1px 2px 1px 0;
            font-size: 11px;
            font-weight: 700;
            background: var(--accent);
            color: var(--accent-text);
        }

        .tag-msg {
            margin: 10px 0;
            font-size: 13px;
            font-weight: 700;
            min-height: 1.2em;
        }

        .tag-msg.error {
            color: var(--error);
        }

        .tag-msg.success {
            color: var(--success);
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: var(--muted);
        }

        .pager {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
            justify-content: flex-end;
        }

        /* 横屏 / 宽屏：基本信息与账户状态在左列上下排列，登录日志在右列撑满两格 */
        @media (min-width: 900px) and (orientation: landscape) {
            .profile-grid {
                grid-template-columns: 1fr 1fr;
            }

            .card-basic {
                grid-column: 1;
                grid-row: 1;
            }

            .card-status {
                grid-column: 1;
                grid-row: 2;
            }

            .card-log {
                grid-column: 2;
                grid-row: 1 / span 2;
            }
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .header-right,
            .btn-logout {
                width: 100%;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>个人中心</h1>
            <div class="header-right">
                <button class="btn btn-logout" id="logoutBtn">登出</button>
            </div>
        </div>

        <div id="statusView" class="loading">加载中...</div>

        <div id="profileContent" class="profile-grid hidden">
            <div class="card card-basic">
                <h2>基本信息</h2>
                <div class="info-row">
                    <span class="info-label">用户名</span>
                    <span id="val-username" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">全名</span>
                    <span id="val-fullname" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">外部ID</span>
                    <span id="val-extid" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">学号</span>
                    <span id="val-student-id" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">性别</span>
                    <span id="val-gender" class="info-value">-</span>
                </div>
                <div class="sync-section">
                    <button class="btn btn-action" id="syncBtn">同步外部信息</button>
                    <p class="sync-note">
                        如果您发现本卡片中的信息未及时更新，请尝试此操作。
                        <br />
                        这将会退出登录当前帐号并要求您重新登录，登录完成后您的信息就会更新。
                    </p>
                </div>
            </div>

            <div class="card card-status">
                <h2>账户状态</h2>
                <div class="info-row">
                    <span class="info-label">状态</span>
                    <span id="val-status">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">角色</span>
                    <span id="val-role" class="info-value">-</span>
                </div>
                <div id="desc-row" class="info-row hidden">
                    <span class="info-label">说明</span>
                    <span id="val-desc" class="info-value" style="color: var(--error);">-</span>
                </div>
                <div id="restriction-row" class="info-row hidden">
                    <span class="info-label">封禁到</span>
                    <span id="val-restriction-end" class="info-value">-</span>
                </div>
            </div>
            <div class="card card-log">
                <h2>登录日志</h2>
                <div class="info-row">
                    <span class="info-label">最近登录时间</span>
                    <span id="val-last-login" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">最近尝试</span>
                    <div id="loginAttemptList" class="info-value"
                        style="flex-direction: column; display: flex; gap: 8px;">
                        <span>加载中...</span>
                    </div>
                </div>
            </div>

            <!-- 标签管理（仅 staff 用户可见） -->
            <div class="card hidden" id="tagManageCard" style="grid-column: 1 / -1;">
                <h2>标签管理</h2>
                <p class="sync-note" id="tagManageHint"></p>

                <!-- 添加标签：用户名 + 姓名双重确认 -->
                <h3 class="tag-subtitle">添加标签</h3>
                <div class="tag-toolbar">
                    <input type="text" id="tagAddUsername" class="tag-input" placeholder="目标用户名">
                    <input type="text" id="tagAddFullname" class="tag-input" placeholder="目标姓名">
                    <select id="tagAddTag" class="tag-input" style="flex:0 0 auto;min-width:120px;"></select>
                    <button class="btn btn-tag" id="tagAddBtn">添加</button>
                </div>
                <p class="sync-note">
                    填写目标用户的“用户名 + 姓名”并提交。
                </p>

                <!-- 已加标签的用户 -->
                <h3 class="tag-subtitle">已加标签的用户</h3>
                <div class="tag-toolbar">
                    <input type="text" id="tagKeyword" class="tag-input" placeholder="搜索 用户名 / 姓名">
                    <button class="btn btn-tag" id="tagSearchBtn">查询</button>
                </div>
                <div id="tagMsg" class="tag-msg"></div>
                <div id="tagUserList"></div>
                <div class="pager">
                    <button class="btn btn-sm btn-ghost" id="tagPrev">上一页</button>
                    <span id="tagPageInfo" style="font-size:12px;color:var(--muted);"></span>
                    <button class="btn btn-sm btn-ghost" id="tagNext">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        © 2026 校园工作台 SSO |
        <a id="agreementLink" href="#">用户协议与隐私政策</a>
    </div>

    <script>
        // 动态检测 auth_path_prefix
        const url = new URL(window.location);
        const pathSegments = url.pathname.split('/').filter(s => s);
        let AUTH_PATH = '/auth';
        if (pathSegments.length > 0 && pathSegments[0] !== 'auth') {
            AUTH_PATH = '/' + pathSegments.slice(0, -1).join('/');
        }

        const statusView = document.getElementById('statusView');
        const profileContent = document.getElementById('profileContent');

        async function loadProfile() {
            try {
                const response = await fetch(`${AUTH_PATH}/profile/api`);

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        handleSessionError('会话已过期，正在重定向到登录页...');
                        return;
                    }
                    throw new Error('加载失败: ' + response.status);
                }

                const data = await response.json();
                if (data.error) {
                    if (/会话|无效|过期/.test(data.error)) {
                        handleSessionError(data.error);
                        return;
                    }
                    throw new Error(data.error);
                }

                renderProfile(data);
            } catch (error) {
                console.error('加载失败:', error);
                statusView.innerHTML = `
                    <div class="error-message">>> ${escapeHtml(error.message)}</div>
                    <button class="btn btn-logout" style="margin-top:20px" onclick="location.reload()">重试</button>
                `;
            }
        }

        function formatLocalTime(timeString) {
            if (timeString === null || timeString === undefined || timeString === '' || timeString === 0) return null;
            let date;
            if (typeof timeString === 'number') {
                // 新版：Unix 时间戳（秒），由浏览器本地化显示
                date = new Date(timeString * 1000);
            } else if (String(timeString).includes('T')) {
                // 兼容：RFC3339 字符串
                date = new Date(timeString);
            } else {
                // 兼容：旧版 "2026-05-09 04:53:26" 格式，假设是 UTC 时间
                date = new Date(timeString + ' UTC');
            }
            if (isNaN(date.getTime())) return String(timeString); // 如果解析失败，返回原字符串
            return date.toLocaleString();
        }

        function renderProfile(data) {
            // 填充文本
            document.getElementById('val-username').textContent = data.username;
            document.getElementById('val-fullname').textContent = data.full_name || '-';
            document.getElementById('val-student-id').textContent = data.student_id || '-';
            document.getElementById('val-gender').textContent = data.gender || '-';
            document.getElementById('val-extid').textContent = data.external_uid || '-';
            // 角色：与标签管理一致的徽章样式
            const roleEl = document.getElementById('val-role');
            const roles = String(data.role || '').split(',').map(s => s.trim()).filter(Boolean);
            roleEl.innerHTML = roles.length
                ? roles.map(r => `<span class="tag-badge">${escapeHtml(r)}</span>`).join(' ')
                : '<span style="color:var(--muted)">-</span>';
            document.getElementById('val-last-login').textContent = formatLocalTime(data.last_login_time) || '-';

            // 状态标签逻辑
            const statusEl = document.getElementById('val-status');
            if (data.state === 1) {
                statusEl.className = 'status-badge warn';
                statusEl.textContent = '受限';
            } else if (data.state === 2) {
                statusEl.className = 'status-badge locked';
                statusEl.textContent = '已锁定';
            } else if (data.state === 3) {
                statusEl.className = 'status-badge warn';
                statusEl.textContent = '跳过验证';
            } else {
                statusEl.className = 'status-badge';
                statusEl.textContent = '正常';
            }

            // 最近登录尝试日志
            renderLoginAttempts(data.login_attempts || []);

            // 异常说明显示
            if (data.state !== 0) {
                document.getElementById('desc-row').classList.remove('hidden');
                document.getElementById('val-desc').textContent = data.state_description || '账户状态异常';
                if (data.restriction_end_time) {
                    document.getElementById('restriction-row').classList.remove('hidden');
                    document.getElementById('val-restriction-end').textContent = formatLocalTime(data.restriction_end_time);
                }
            }

            // 切换视图
            statusView.classList.add('hidden');
            profileContent.classList.remove('hidden');

            // 标签管理（staff 用户展示）
            setupTagManage(data);
        }

        // ---- 标签管理（staff）----
        const tagState = { me: '', keyword: '', offset: 0, limit: 50, hasMore: false, manageable: [] };

        function showTagMsg(text, isError) {
            const el = document.getElementById('tagMsg');
            el.textContent = text || '';
            el.className = 'tag-msg ' + (isError ? 'error' : 'success');
            if (text) setTimeout(() => { el.textContent = ''; }, 3000);
        }

        async function setupTagManage(data) {
            const card = document.getElementById('tagManageCard');
            if (!data.can_manage_tags) return;
            try {
                const r = await fetch(`${AUTH_PATH}/profile/tags`);
                const d = await r.json();
                if (d.error || !d.can_manage) return;
                tagState.me = data.username;
                tagState.manageable = d.manageable_tags || [];
                if (!tagState.manageable.length) return;

                // 填充可添加的标签下拉框
                const sel = document.getElementById('tagAddTag');
                sel.innerHTML = tagState.manageable.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');

                document.getElementById('tagManageHint').textContent =
                    '您可以管理的标签：' + tagState.manageable.join('、') + '。';
                card.classList.remove('hidden');
                loadTagUsers(0);
            } catch (e) {
                // 静默失败，不阻塞个人中心
            }
        }

        async function loadTagUsers(offset) {
            tagState.offset = offset;
            const params = new URLSearchParams({ keyword: tagState.keyword, limit: tagState.limit, offset: tagState.offset });
            try {
                const r = await fetch(`${AUTH_PATH}/profile/tags/users?${params}`);
                if (!r.ok) { showTagMsg('加载失败', true); return; }
                const d = await r.json();
                if (d.error) { showTagMsg(d.error, true); return; }
                const list = d.users || [];
                tagState.hasMore = list.length >= tagState.limit;
                renderTagUsers(list);
                document.getElementById('tagPageInfo').textContent =
                    `第 ${Math.floor(tagState.offset / tagState.limit) + 1} 页${tagState.hasMore ? '+' : ''}`;
            } catch (e) {
                showTagMsg('网络错误', true);
            }
        }

        function renderTagUsers(list) {
            const wrap = document.getElementById('tagUserList');
            if (!list.length) {
                wrap.innerHTML = '<div class="empty">暂无已加标签的用户</div>';
                return;
            }
            let html = '<table class="tag-table"><thead><tr><th>用户名</th><th>姓名</th><th>标签</th><th>操作</th></tr></thead><tbody>';
            for (const u of list) {
                const roles = (u.role || '').split(',').map(s => s.trim()).filter(Boolean);
                const badges = roles.length
                    ? roles.map(r => `<span class="tag-badge">${escapeHtml(r)}</span>`).join(' ')
                    : '<span style="color:var(--muted)">-</span>';
                // 自己的行不提供任何操作（staff 不能修改自己的标签）
                // 同组管理员（is_admin）可见但不可操作：不允许增删其标签
                let ops;
                if (u.username === tagState.me) {
                    ops = '<span style="color:var(--muted)">（自己）</span>';
                } else if (u.is_admin) {
                    ops = '<span style="color:var(--muted)">（管理员，不可修改）</span>';
                } else {
                    // 仅提供移除按钮：添加标签需通过上方表单填写用户名+姓名确认
                    ops = tagState.manageable
                        .filter(t => roles.includes(t))
                        .map(t => `<button class="btn btn-tag btn-sm" data-tagact="remove" data-username="${escapeHtml(u.username)}" data-tag="${escapeHtml(t)}">移除 ${escapeHtml(t)}</button>`)
                        .join(' ') || '<span style="color:var(--muted)">-</span>';
                }
                html += `<tr>
                    <td><strong>${escapeHtml(u.username)}</strong></td>
                    <td>${escapeHtml(u.full_name) || '-'}</td>
                    <td style="white-space:normal">${badges}</td>
                    <td style="white-space:normal">${ops}</td>
                </tr>`;
            }
            html += '</tbody></table>';
            wrap.innerHTML = html;
        }

        async function doTagAction(username, tag, act) {
            const url = act === 'add'
                ? `${AUTH_PATH}/profile/tags/add`
                : `${AUTH_PATH}/profile/tags/remove`;
            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, tag }),
                });
                const d = await r.json();
                if (d.error) showTagMsg(d.error, true);
                else { showTagMsg(d.message || '操作成功'); loadTagUsers(tagState.offset); }
            } catch (e) {
                showTagMsg('网络错误', true);
            }
        }

        // 通过“用户名 + 姓名”添加标签（服务端核对身份）
        async function doAddTag() {
            const username = document.getElementById('tagAddUsername').value.trim();
            const full_name = document.getElementById('tagAddFullname').value.trim();
            const tag = document.getElementById('tagAddTag').value;
            if (!username) { showTagMsg('请填写目标用户名', true); return; }
            if (!full_name) { showTagMsg('请填写目标姓名', true); return; }
            try {
                const r = await fetch(`${AUTH_PATH}/profile/tags/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, full_name, tag }),
                });
                const d = await r.json();
                if (d.error) { showTagMsg(d.error, true); return; }
                showTagMsg(d.message || '已添加');
                document.getElementById('tagAddUsername').value = '';
                document.getElementById('tagAddFullname').value = '';
                loadTagUsers(0);
            } catch (e) {
                showTagMsg('网络错误', true);
            }
        }

        function handleSessionError(msg) {
            clearSessionCookie();
            statusView.innerHTML = `<div class="error-message">${escapeHtml(msg)}</div>`;
            setTimeout(() => { window.location.href = `${AUTH_PATH}/`; }, 1500);
        }

        function renderLoginAttempts(attempts) {
            const list = document.getElementById('loginAttemptList');
            list.innerHTML = '';
            if (!Array.isArray(attempts) || attempts.length === 0) {
                list.innerHTML = '<span>最近没有登录尝试记录。</span>';
                return;
            }

            attempts.forEach((attempt) => {
                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center'; // 垂直居中
                item.style.fontSize = '12px';
                item.style.borderBottom = '1px solid var(--input-bg)'; // 增加分割线感
                item.style.paddingBottom = '4px';

                // 状态标签 (成功/失败)
                const statusLabel = document.createElement('span');
                statusLabel.textContent = attempt.success ? '成功' : '失败';
                statusLabel.className = 'status-badge ' + (attempt.success ? '' : 'locked');
                statusLabel.style.padding = '2px 6px';
                statusLabel.style.fontSize = '10px';

                // 时间 + IP + 位置
                const infoLabel = document.createElement('span');
                infoLabel.className = 'info-value';

                // 拼接地理信息
                let geoInfo;
                if (attempt.region === attempt.country) {
                    geoInfo = attempt.country;
                } else {
                    geoInfo = [attempt.country, attempt.region].filter(Boolean).join(',');
                }
                
                const locationText = geoInfo ? `${geoInfo}` : '';

                // 最终组合
                infoLabel.textContent = `${formatLocalTime(attempt.timestamp)}·${locationText || '未知IP'}`;

                item.appendChild(statusLabel);
                item.appendChild(infoLabel);
                list.appendChild(item);
            });
        }

        function clearSessionCookie() {
            document.cookie = `sso_session=; path=${AUTH_PATH}; expires=Thu, 01 Jan 1970 00:00:00 UTC; HttpOnly; SameSite=Lax;`;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // 登出
        document.getElementById('logoutBtn').addEventListener('click', () => {
            clearSessionCookie();
            window.location.href = `${AUTH_PATH}/logout`;
        });

        // 同步外部信息
        document.getElementById('syncBtn').addEventListener('click', async (e) => {
            const response = await fetch(`${AUTH_PATH}/logout`, {
                method: 'GET',
            });
            clearSessionCookie();
            window.location.href = `${AUTH_PATH}?sync_info=1`;
        });

        // 更新 agreement 链接
        document.getElementById('agreementLink').href = `${AUTH_PATH}/agreement`;

        // ---- 标签管理事件 ----
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-tagact]');
            if (btn) {
                doTagAction(btn.dataset.username, btn.dataset.tag, btn.dataset.tagact);
                return;
            }
        });

        document.getElementById('tagAddBtn').addEventListener('click', () => {
            doAddTag();
        });

        document.getElementById('tagSearchBtn').addEventListener('click', () => {
            tagState.keyword = document.getElementById('tagKeyword').value.trim();
            loadTagUsers(0);
        });
        document.getElementById('tagKeyword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('tagSearchBtn').click();
        });
        document.getElementById('tagPrev').addEventListener('click', () => {
            if (tagState.offset > 0) loadTagUsers(Math.max(0, tagState.offset - tagState.limit));
        });
        document.getElementById('tagNext').addEventListener('click', () => {
            if (tagState.hasMore) loadTagUsers(tagState.offset + tagState.limit);
        });

        loadProfile();
    </script>
</body>

</html>
