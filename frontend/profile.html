<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>个人中心 - 校园工作台 SSO</title>
    <style>
        @font-face {
            font-family: sarasa;
            src: url('/font.woff');
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --border: #1a1a1a;
            --input-bg: #f2f2f2;
            --accent: #000000;
            --accent-text: #ffffff;
            --error: #e63946;
            --success: #06d6a0;
            --warn: #f4a261;
            --muted: #666666;
            --card-bg: #f9f9f9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text: #eeeeee;
                --border: #444444;
                --input-bg: #1e1e1e;
                --accent: #eeeeee;
                --accent-text: #121212;
                --muted: #888888;
                --card-bg: #1e1e1e;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: ui-monospace, sarasa, monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            border-bottom: 4px solid var(--border);
            margin-bottom: 30px;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-logout {
            background: var(--error);
            color: var(--accent-text);
        }

        .btn-action {
            background: var(--accent);
            color: var(--accent-text);
            margin-top: 10px;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 20px;
            border-radius: 4px;
        }

        .card h2 {
            margin: 0 0 15px 0;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .sync-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border);
        }

        .sync-note {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.4;
        }

        .info-label {
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
        }

        .info-value {
            color: var(--text);
            word-break: break-all;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            background: var(--success);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 2px;
        }

        .status-badge.locked {
            background: var(--error);
            color: white;
        }

        .status-badge.warn {
            background: var(--warn);
            color: black;
        }

        .hidden {
            display: none;
        }

        .loading,
        .error-container {
            text-align: center;
            padding: 40px;
        }

        .error-message {
            color: var(--error);
            font-weight: 700;
            padding: 15px;
            background: var(--card-bg);
            border-left: 4px solid var(--error);
            text-align: left;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: var(--muted);
            line-height: 1.6;
            text-align: center;
        }

        .footer a {
            color: var(--text);
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .header-right,
            .btn-logout {
                width: 100%;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>个人中心</h1>
            <div class="header-right">
                <button class="btn btn-logout" id="logoutBtn">登出</button>
            </div>
        </div>

        <div id="statusView" class="loading">加载中...</div>

        <div id="profileContent" class="profile-grid hidden">
            <div class="card">
                <h2>基本信息</h2>
                <div class="info-row">
                    <span class="info-label">用户名</span>
                    <span id="val-username" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">全名</span>
                    <span id="val-fullname" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">外部ID</span>
                    <span id="val-extid" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">学号</span>
                    <span id="val-student-id" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">性别</span>
                    <span id="val-gender" class="info-value">-</span>
                </div>
                <div class="sync-section">
                    <button class="btn btn-action" id="syncBtn">同步外部信息</button>
                    <p class="sync-note">
                        如果您发现本卡片中的信息未及时更新，请尝试此操作。
                        <br />
                        这将会退出登录当前帐号并要求您重新登录，登录完成后您的信息就会更新。
                    </p>
                </div>
            </div>

            <div class="card">
                <h2>账户状态</h2>
                <div class="info-row">
                    <span class="info-label">状态</span>
                    <span id="val-status">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">角色</span>
                    <span id="val-role" class="info-value">-</span>
                </div>
                <div id="desc-row" class="info-row hidden">
                    <span class="info-label">说明</span>
                    <span id="val-desc" class="info-value" style="color: var(--error);">-</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        © 2026 校园工作台 SSO |
        <a href="/auth/agreement">用户协议与隐私政策</a>
    </div>

    <script>
        const statusView = document.getElementById('statusView');
        const profileContent = document.getElementById('profileContent');

        async function loadProfile() {
            try {
                const response = await fetch('/auth/profile/api');

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        handleSessionError('会话已过期，正在重定向到登录页...');
                        return;
                    }
                    throw new Error('加载失败: ' + response.status);
                }

                const data = await response.json();
                if (data.error) {
                    if (/会话|无效|过期/.test(data.error)) {
                        handleSessionError(data.error);
                        return;
                    }
                    throw new Error(data.error);
                }

                renderProfile(data);
            } catch (error) {
                console.error('加载失败:', error);
                statusView.innerHTML = `
                    <div class="error-message">>> ${escapeHtml(error.message)}</div>
                    <button class="btn btn-logout" style="margin-top:20px" onclick="location.reload()">重试</button>
                `;
            }
        }

        function renderProfile(data) {
            // 填充文本
            document.getElementById('val-username').textContent = data.username;
            document.getElementById('val-fullname').textContent = data.full_name || '-';
            document.getElementById('val-student-id').textContent = data.student_id || '-';
            document.getElementById('val-gender').textContent = data.gender || '-';
            document.getElementById('val-extid').textContent = data.external_uid || '-';
            document.getElementById('val-role').textContent = data.role;

            // 状态标签逻辑
            const statusEl = document.getElementById('val-status');
            if (data.state === 1 || data.state === 2) {
                statusEl.className = 'status-badge locked';
                statusEl.textContent = '已禁用';
            } else if (data.state === 3) {
                statusEl.className = 'status-badge warn';
                statusEl.textContent = '跳过验证';
            } else {
                statusEl.className = 'status-badge';
                statusEl.textContent = '正常';
            }

            // 异常说明显示
            if (data.state !== 0) {
                document.getElementById('desc-row').classList.remove('hidden');
                document.getElementById('val-desc').textContent = data.state_description || '账户状态异常';
            }

            // 切换视图
            statusView.classList.add('hidden');
            profileContent.classList.remove('hidden');
        }

        function handleSessionError(msg) {
            clearSessionCookie();
            statusView.innerHTML = `<div class="error-message">${escapeHtml(msg)}</div>`;
            setTimeout(() => { window.location.href = '/auth/'; }, 1500);
        }

        function clearSessionCookie() {
            document.cookie = 'sso_session=; path=/auth; expires=Thu, 01 Jan 1970 00:00:00 UTC; HttpOnly; SameSite=Lax;';
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // 登出
        document.getElementById('logoutBtn').addEventListener('click', () => {
            clearSessionCookie();
            window.location.href = '/auth/logout';
        });

        // 同步外部信息
        document.getElementById('syncBtn').addEventListener('click', async (e) => {
            const response = await fetch('/auth/logout', {
                method: 'GET',
            });
            clearSessionCookie();
            window.location.href = "/auth/?sync_info=1";
        });

        loadProfile();
    </script>
</body>

</html>
