<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校园工作台 SSO</title>
    <style>
        @font-face {
            font-family: 'sarasa';
            src: url('/font.woff');
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --border: #1a1a1a;
            --input-bg: #f2f2f2;
            --accent: #000000;
            --accent-text: #ffffff;
            --error: #e63946;
            --muted: #666666;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text: #eeeeee;
                --border: #444444;
                --input-bg: #1e1e1e;
                --accent: #eeeeee;
                --accent-text: #121212;
                --muted: #888888;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: ui-monospace, 'sarasa', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 20px;
        }

        .header {
            border-bottom: 4px solid var(--border);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .form-item {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-bottom-color: var(--text);
        }

        .options {
            display: flex;
            align-items: center;
            margin: 20px 0;
            font-size: 13px;
            font-weight: bold;
        }

        .options input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            font-family: inherit;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        button:disabled {
            background: var(--input-bg);
            color: var(--muted);
            cursor: not-allowed;
        }

        #msg {
            margin-top: 15px;
            font-size: 13px;
            color: var(--error);
            font-weight: bold;
            text-align: center;
            min-height: 1.2em;
        }

        /* 正在登录到的服务信息 */
        .client-info {
            background: var(--input-bg);
            padding: 14px 16px;
            margin-bottom: 20px;
            font-size: 12px;
            line-height: 1.8;
            border-left: 4px solid var(--accent);
        }

        .client-info .ci-name {
            font-weight: 900;
            font-size: 15px;
            word-break: break-all;
        }

        .client-info .ci-fields {
            color: var(--muted);
        }

        /* 客户端配置错误（页面加载阶段即展示） */
        .client-fatal {
            background: var(--input-bg);
            color: var(--error);
            font-weight: bold;
            font-size: 13px;
            padding: 15px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: var(--muted);
            line-height: 1.6;
        }

        .footer a {
            color: var(--text);
            text-decoration: underline;
        }

        /* 手机适配 */
        @media (max-width: 400px) {
            .container {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>SSO 登录</h1>
        </div>

        <!-- 正在登录到的服务及其将获得的信息 -->
        <div id="clientInfo" class="client-info hidden">
            <div>正在登录到</div>
            <div class="ci-name" id="ciName"></div>
            <div class="ci-fields" id="ciFields"></div>
        </div>

        <!-- 客户端配置错误：页面加载阶段即展示，禁止登录 -->
        <div id="clientFatal" class="client-fatal hidden"></div>

        <form id="loginForm">
            <div class="form-item">
                <label>账号</label>
                <input type="text" id="username" required autocomplete="username" placeholder="您的校园网账号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="您的校园网密码">
            </div>

            <div class="options">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe" style="margin-bottom: 0;">记住我</label>
            </div>

            <button type="submit" id="submitBtn">登录</button>
        </form>

        <div id="msg"></div>

        <div class="footer">
            继续代表您已同意我们的<a id="agreementLink" href="#">用户协议与隐私政策</a>.
        </div>
    </div>

    <script>
        // 动态检测 auth_path_prefix
        function detectAuthPath() {
            const url = new URL(window.location);
            const pathSegments = url.pathname.split('/').filter(s => s);
            // 默认为 /sso，但如果路径不是 / 开头，则取自定义prefix
            if (pathSegments.length === 0) return '/sso';
            return '/' + pathSegments[0];
        }
        
        const AUTH_PATH = detectAuthPath();

        // 页面加载时检测是否需要清除过期cookie
        async function validateSession() {
            const hasCookie = document.cookie.includes('sso_session');
            if (hasCookie) {
                try {
                    const resp = await fetch(`${AUTH_PATH}/profile/api`);
                    if (!resp.ok) {
                        // Cookie过期，清除它
                        document.cookie = `sso_session=; path=${AUTH_PATH}; expires=Thu, 01 Jan 1970 00:00:00 UTC;`;
                    }
                } catch (e) {
                    // 网络错误，暂不清除
                }
            }
        }
        
        // 页面加载时验证session
        validateSession();

        // 更新 agreement 链接
        document.getElementById('agreementLink').href = `${AUTH_PATH}/agreement`;

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');

        // ===== 客户端信息展示与预校验 =====
        // return_extra_userinfo 字段的中文名称
        const FIELD_LABELS = {
            external_uid: '外部ID',
            full_name: '姓名',
            student_id: '学号',
            gender: '性别',
            role: '角色',
        };

        // 客户端配置非法：立即展示错误并禁用登录，无需等到点击登录
        function showClientFatal(text) {
            const fatalEl = document.getElementById('clientFatal');
            fatalEl.textContent = text;
            fatalEl.classList.remove('hidden');
            document.getElementById('clientInfo').classList.add('hidden');
            loginForm.style.display = 'none';
        }

        // 页面加载时获取“正在登录到”的服务信息，同时预校验 client 配置合法性
        async function loadClientInfo() {
            const params = new URLSearchParams(window.location.search);
            const clientId = params.get('client_id') || '';
            if (!clientId) return; // 个人中心直接登录，不展示

            try {
                const q = new URLSearchParams({ client_id: clientId });
                const ru = params.get('redirect_uri');
                if (ru) q.set('redirect_uri', ru);
                const r = await fetch(`${AUTH_PATH}/client-info?${q}`);
                const d = await r.json();
                if (!r.ok || d.error) {
                    showClientFatal(d.error || 'OAuth客户端配置错误，无法登录');
                    return;
                }
                document.getElementById('ciName').textContent = d.friendly_name || clientId;
                const fields = (d.userinfo_fields || []).map(f => FIELD_LABELS[f] || f);
                document.getElementById('ciFields').textContent =
                    fields.length ? `登录后该服务将获得：${fields.join('、')}` : '';
                document.getElementById('clientInfo').classList.remove('hidden');
            } catch (e) {
                showClientFatal('无法连接认证服务，请稍后重试');
            }
        }
        loadClientInfo();

        async function webCryptoEncrypt(text, keyHex) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const keyBytes = new Uint8Array(keyHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['encrypt']);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertextBuffer = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, data);
            const combined = new Uint8Array(iv.length + ciphertextBuffer.byteLength);
            combined.set(iv);
            combined.set(new Uint8Array(ciphertextBuffer), iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "连接中...";
            msg.innerText = "";

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const clientId = urlParams.get('client_id') || "";
                const redirectUri = urlParams.get('redirect_uri') || "";
                const oauthState = urlParams.get('state') || "";
                const oauthNonce = urlParams.get('nonce') || "";
                const syncInfo = urlParams.get('sync_info')==="1" || urlParams.get('sync_info')==="true" || false;

                // 如果没有client_id，则为直接登录模式（无OAuth）
                const isDirectLogin = !clientId || clientId === "";

                const configRes = await fetch(`${AUTH_PATH}/crypto-config`);
                if (!configRes.ok) {
                    throw new Error('获取配置失败');
                }
                
                const { shared_key } = await configRes.json();

                const rawPayload = `${document.getElementById('username').value}|${document.getElementById('password').value}|${Math.floor(Date.now() / 1000)}`;
                const encryptedData = await webCryptoEncrypt(rawPayload, shared_key);

                const res = await fetch(`${AUTH_PATH}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        encrypted_payload: encryptedData,
                        remember: document.getElementById('rememberMe').checked,
                        client_id: clientId,
                        redirect_uri: redirectUri,
                        state: oauthState,
                        nonce: oauthNonce,
                        sync_info: syncInfo
                    })
                });

                const resText = await res.text();
                if (res.ok) {

                    const data = JSON.parse(resText);

                    if (!data.error) {
                        submitBtn.innerText = "跳转中...";
                        // 处理直接登录响应
                        if (data.is_direct_login) {
                            window.location.href = data.redirect_uri;
                        } else {
                            // 处理OAuth响应
                            const target = new URL(data.redirect_uri);
                            target.searchParams.set('code', data.code);
                            if (data.state) target.searchParams.set('state', data.state);
                            if (data.nonce) target.searchParams.set('nonce', data.nonce);
                            window.location.href = target.toString();
                        }
                    } else {
                        msg.innerText = data.error;
                        submitBtn.disabled = false;
                        submitBtn.innerText = "登录";
                    }

                } else {
                    let errStr = "连接失败";
                    try { 
                        const errorData = JSON.parse(resText);
                        errStr = errorData.error || resText; 
                    } catch (e) { 
                        errStr = resText || "请求失败"; 
                    }
                    throw new Error(errStr);
                }
            } catch (err) {
                msg.innerText = err.message;
                submitBtn.disabled = false;
                submitBtn.innerText = "登录";
            }
        };
    </script>
</body>

</html>
