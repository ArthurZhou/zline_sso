<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>继续登录</title>
    <style>
        @font-face {
            font-family: 'sarasa';
            src: url('/font.woff');
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --border: #1a1a1a;
            --accent-bg: #f2f2f2;
            --btn-primary: #1a1a1a;
            --btn-primary-text: #ffffff;
            --btn-secondary: #ffffff;
            --btn-secondary-text: #1a1a1a;
            --muted: #666666;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text: #eeeeee;
                --border: #444444;
                --accent-bg: #1e1e1e;
                --btn-primary: #eeeeee;
                --btn-primary-text: #121212;
                --btn-secondary: #121212;
                --btn-secondary-text: #eeeeee;
                --muted: #888888;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: ui-monospace, 'sarasa', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 20px;
        }

        .header {
            border-bottom: 4px solid var(--border);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .user-box {
            border: 2px solid var(--border);
            background: var(--accent-bg);
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .username {
            font-size: 20px;
            font-weight: 900;
            word-break: break-all;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: opacity 0.2s;
        }

        .btn-primary {
            background: var(--btn-primary);
            color: var(--btn-primary-text);
        }

        .btn-secondary {
            background: var(--btn-secondary);
            color: var(--btn-secondary-text);
        }

        .btn:active {
            opacity: 0.8;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: var(--muted);
            line-height: 1.6;
        }

        .footer a {
            color: var(--text);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>欢迎回来</h1>
        </div>

        <div class="user-box">
            <span class="label">已登录账户</span>
            <span class="username">{{username}}</span>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="handleContinue()">使用此账户继续</button>
            <button class="btn btn-secondary" onclick="handleLogout()">退出并切换</button>
        </div>

        <div class="footer">
            继续代表您已同意我们的<a id="agreementLink" href="#">用户协议与隐私政策</a>.
        </div>
    </div>

    <script>
        // 动态检测 auth_path_prefix
        function detectAuthPath() {
            const url = new URL(window.location);
            const pathSegments = url.pathname.split('/').filter(s => s);
            // 默认为 /sso，但如果路径不是 / 开头，则取自定义prefix
            if (pathSegments.length === 0) return '/sso';
            return '/' + pathSegments[0];
        }
        
        const AUTH_PATH = detectAuthPath();
        const queryParams = window.location.search;

        async function handleContinue() {
            try {
                const resp = await fetch(`${AUTH_PATH}/continue${queryParams}`);
                if (resp.ok) {
                    const data = await resp.json();
                    
                    // --- 关键修复：智能处理 URL 拼接 ---
                    const redirectBase = data.redirect_uri;
                    // 判断原 URI 是否已包含问号
                    const separator = redirectBase.includes('?') ? '&' : '?';
                    
                    let target = `${redirectBase}${separator}code=${data.code}`;
                    if (data.state) {
                        target += `&state=${encodeURIComponent(data.state)}`;
                    }
                    
                    window.location.href = target;
                    // ------------------------------
                    
                } else {
                    const errorText = await resp.text();
                    alert("Auth Error: " + errorText);
                }
            } catch (e) {
                alert("Network failure.");
            }
        }

        function handleLogout() {
            window.location.href = `${AUTH_PATH}/logout${queryParams}`;
        }

        // 更新 agreement 链接
        document.getElementById('agreementLink').href = `${AUTH_PATH}/agreement`;
    </script>
</body>

</html>
