<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>继续登录</title>
    <style>
        @font-face {
            font-family: 'sarasa';
            src: url('/font.woff');
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --border: #1a1a1a;
            --accent-bg: #f2f2f2;
            --btn-primary: #1a1a1a;
            --btn-primary-text: #ffffff;
            --btn-secondary: #ffffff;
            --btn-secondary-text: #1a1a1a;
            --muted: #666666;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text: #eeeeee;
                --border: #444444;
                --accent-bg: #1e1e1e;
                --btn-primary: #eeeeee;
                --btn-primary-text: #121212;
                --btn-secondary: #121212;
                --btn-secondary-text: #eeeeee;
                --muted: #888888;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: ui-monospace, 'sarasa', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 20px;
        }

        .header {
            border-bottom: 4px solid var(--border);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .user-box {
            background: var(--accent-bg);
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* 正在登录到的服务信息 */
        .client-box {
            background: var(--accent-bg);
            padding: 16px 20px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 4px solid var(--text);
        }

        .client-box .ci-name {
            font-size: 16px;
            font-weight: 900;
            word-break: break-all;
        }

        .client-box .ci-fields {
            display: block;
            margin-top: 8px;
            font-size: 11px;
            color: var(--muted);
        }

        /* 客户端配置错误（页面加载阶段即展示） */
        .client-fatal {
            background: var(--accent-bg);
            color: var(--error);
            font-weight: bold;
            font-size: 13px;
            padding: 15px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .username {
            font-size: 20px;
            font-weight: 900;
            word-break: break-all;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background: var(--btn-primary);
            color: var(--btn-primary-text);
        }

        .btn-secondary {
            background: var(--btn-secondary);
            color: var(--btn-secondary-text);
        }

        .btn:active {
            opacity: 0.8;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: var(--muted);
            line-height: 1.6;
        }

        .footer a {
            color: var(--text);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>欢迎回来</h1>
        </div>

        <!-- 正在登录到的服务及其将获得的信息 -->
        <div id="clientBox" class="client-box hidden">
            <span class="label">正在登录到</span>
            <span class="ci-name" id="ciName"></span>
            <span class="ci-fields" id="ciFields"></span>
        </div>

        <!-- 客户端配置错误：页面加载阶段即展示，禁止继续 -->
        <div id="clientFatal" class="client-fatal hidden"></div>

        <div class="user-box">
            <span class="label">已登录账户</span>
            <span class="username">{{username}}</span>
        </div>

        <div class="btn-group" id="btnGroup">
            <button class="btn btn-primary" onclick="handleContinue()">使用此账户继续</button>
            <button class="btn btn-secondary" onclick="handleLogout()">退出并切换</button>
        </div>

        <div class="footer">
            继续代表您已同意我们的<a id="agreementLink" href="#">用户协议与隐私政策</a>.
        </div>
    </div>

    <script>
        // 动态检测 auth_path_prefix
        function detectAuthPath() {
            const url = new URL(window.location);
            const pathSegments = url.pathname.split('/').filter(s => s);
            // 默认为 /sso，但如果路径不是 / 开头，则取自定义prefix
            if (pathSegments.length === 0) return '/sso';
            return '/' + pathSegments[0];
        }
        
        const AUTH_PATH = detectAuthPath();
        const queryParams = window.location.search;

        // ===== 客户端信息展示与预校验 =====
        // return_extra_userinfo 字段的中文名称
        const FIELD_LABELS = {
            external_uid: '外部ID',
            full_name: '姓名',
            student_id: '学号',
            gender: '性别',
            role: '角色',
        };

        // 客户端配置非法：立即展示错误并禁用继续，无需等到点击继续
        function showClientFatal(text) {
            const fatalEl = document.getElementById('clientFatal');
            fatalEl.textContent = text;
            fatalEl.classList.remove('hidden');
            document.getElementById('clientBox').classList.add('hidden');
            document.getElementById('btnGroup').style.display = 'none';
        }

        // 页面加载时获取“正在登录到”的服务信息，同时预校验 client 配置合法性
        async function loadClientInfo() {
            const params = new URLSearchParams(queryParams);
            const clientId = params.get('client_id') || '';
            if (!clientId) return; // 个人中心直接登录，不展示

            try {
                const r = await fetch(`${AUTH_PATH}/client-info${queryParams}`);
                const d = await r.json();
                if (!r.ok || d.error) {
                    showClientFatal(d.error || 'OAuth客户端配置错误，无法继续');
                    return;
                }
                document.getElementById('ciName').textContent = d.friendly_name || clientId;
                const fields = (d.userinfo_fields || []).map(f => FIELD_LABELS[f] || f);
                document.getElementById('ciFields').textContent =
                    fields.length ? `继续后该服务将获得：${fields.join('、')}` : '';
                document.getElementById('clientBox').classList.remove('hidden');
            } catch (e) {
                showClientFatal('无法连接认证服务，请稍后重试');
            }
        }
        loadClientInfo();

        async function handleContinue() {
            try {
                const resp = await fetch(`${AUTH_PATH}/continue${queryParams}`);
                if (resp.ok) {
                    const data = await resp.json();
                    if (!data.code || !data.redirect_uri) {
                        alert("Network failure.");
                        return;
                    }

                    // 个人中心登录：直接跳转
                    if (data.code === 'profile') {
                        window.location.href = data.redirect_uri;
                        return;
                    }

                    // --- 关键修复：智能处理 URL 拼接 ---
                    const redirectBase = data.redirect_uri;
                    // 判断原 URI 是否已包含问号
                    const separator = redirectBase.includes('?') ? '&' : '?';
                    
                    let target = `${redirectBase}${separator}code=${data.code}`;
                    if (data.state) {
                        target += `&state=${encodeURIComponent(data.state)}`;
                    }
                    if (data.nonce) {
                        target += `&nonce=${encodeURIComponent(data.nonce)}`;
                    }
                    
                    window.location.href = target;
                    // ------------------------------
                    
                } else {
                    // 无论何种错误，始终只显示网络失败，不泄露服务端错误详情
                    alert("Network failure.");
                }
            } catch (e) {
                alert("Network failure.");
            }
        }

        function handleLogout() {
            window.location.href = `${AUTH_PATH}/logout${queryParams}`;
        }

        // 更新 agreement 链接
        document.getElementById('agreementLink').href = `${AUTH_PATH}/agreement`;
    </script>
</body>

</html>
