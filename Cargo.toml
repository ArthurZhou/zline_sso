[package]
name = "zline_sso"
version = "0.1.7"
edition = "2024"

[dependencies]
# HTTP
axum = { version = "0.7.9", features = ["macros"] }
axum-extra = { version = "0.9.6", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header", "trace"] }
tower_governor = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
toml = "0.8"
regex = "1"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# 加密与安全
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"
aes-gcm = "0.10"
jsonwebtoken = "9.0"
base64 = "0.21" 
hex = "0.4"
rand = "0.8"

once_cell = "1.20"

# HTTP 客户端
reqwest = { version = "0.11", default-features = false, features = ["json", "cookies", "rustls-tls"] }

time = "0.3"
url = "2.5.8"
maxminddb = "0.25"


[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"